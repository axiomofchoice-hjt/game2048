# 构建并把 dist 推送到 gh-pages 分支（供 GitHub Pages「Deploy from a branch」部署）
name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [master]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
